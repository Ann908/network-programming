name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  COVERAGE_MIN: '90'
  REGISTRY: ghcr.io

jobs:
  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PRODUCTS_DATABASE_URI: 'sqlite:///:memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=reports/junit.xml

      - name: Check coverage
        shell: bash
        run: |
          total=$(python -m coverage report --format=total)
          {
            echo "### Покриття тестами: ${total}% (мінімум ${COVERAGE_MIN}%)"
            echo '```text'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! python -m coverage report --fail-under="$COVERAGE_MIN"; then
            echo "::error title=Недостатнє покриття::Покриття ${total}% нижче порогу ${COVERAGE_MIN}%"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            reports/junit.xml

  docker:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max